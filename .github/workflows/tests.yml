name: Tests

on:
  push:
    paths-ignore: ["data.json", "listings.json", "recaps/**", "cote-auto.xlsx"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Construction de la base Excel
        run: node src/export.mjs | python3 scripts/build_excel.py "$RUNNER_TEMP/test.xlsx"
